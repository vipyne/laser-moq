# Production: MediaMTX + Caddy (automatic TLS for $HLS_DOMAIN).
# Ports: 1935/tcp (RTMP in), 80+443/tcp (Caddy). 8888 stays internal.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: laser-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"
    environment:
      # replaces the local-dev 'changeme' publish password from mediamtx.yml
      - MTX_AUTHINTERNALUSERS_1_PASS=${RTMP_PUBLISH_PASS:?set RTMP_PUBLISH_PASS in .env}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  caddy:
    image: caddy:2
    container_name: laser-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HLS_DOMAIN=${HLS_DOMAIN:?set HLS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [mediamtx]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  caddy_data:
  caddy_config:
